name: Backend CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/nw_test
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          for script in ops/*.sh docker/db/init/*.sh; do bash -n "$script"; done
      - name: Test
        run: pytest
      - name: Migrations
        env:
          PGPASSWORD: postgres
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/nw_migrate
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE nw_migrate'
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: OpenAPI is up to date
        run: python scripts/export_openapi.py --check

  docker:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --build-arg "REVISION=$GITHUB_SHA" -t "naverwebtoon-backend:$GITHUB_SHA" .
      - name: docker compose up (local compose)
        env:
          REVISION: ${{ github.sha }}
        run: |
          cp .env.example .env
          docker compose up -d --no-build
          scripts/wait-healthy.sh "$GITHUB_SHA"
          scripts/smoke.sh http://127.0.0.1:8080
      - name: Logs (local compose)
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local compose
        if: always()
        run: docker compose down -v
      - name: docker compose up (production compose)
        env:
          REVISION: ${{ github.sha }}
        run: |
          sudo install -d -m 0700 /etc/naverwebtoon-backend
          {
            echo APP_ENV=production
            echo POSTGRES_PASSWORD=ci-postgres
            echo NW_OWNER_PASSWORD=ci-owner
            echo NW_APP_PASSWORD=ci-app
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo AUTHOR_INVITE_CODES=invite-code-1
            echo PUBLIC_BASE_URL=http://127.0.0.1:8080
            echo AI_BACKEND=fake
            echo STORAGE_BACKEND=fake
          } | sudo tee /etc/naverwebtoon-backend/backend.env >/dev/null
          prod() {
            sudo -E docker compose --project-name naverwebtoon --env-file /etc/naverwebtoon-backend/backend.env \
              -f docker-compose.prod.yml "$@"
          }
          prod run --rm migrate
          prod up -d --remove-orphans --wait --wait-timeout 180
          scripts/wait-healthy.sh "$GITHUB_SHA"
          scripts/smoke.sh http://127.0.0.1:8080
          # 같은 리비전으로 다시 배포해도(마이그레이션 재실행 포함) 정상이어야 한다.
          prod run --rm migrate
          prod up -d --remove-orphans --wait --wait-timeout 180
          scripts/wait-healthy.sh "$GITHUB_SHA"
      - name: Logs (production compose)
        if: failure()
        run: >-
          sudo -E docker compose --project-name naverwebtoon --env-file /etc/naverwebtoon-backend/backend.env
          -f docker-compose.prod.yml logs --no-color
        env:
          REVISION: ${{ github.sha }}
      - name: Package release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir dist
          docker save "naverwebtoon-backend:$GITHUB_SHA" | gzip -6 > dist/backend-image.tar.gz
          tar --owner=0 --group=0 --numeric-owner -czf dist/deploy.tar.gz docker-compose.prod.yml docker/db/init
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: backend-release
          path: dist/
          if-no-files-found: error
          retention-days: 3

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: backend-production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-release
          path: dist
      - name: Sign and publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_RELEASE_SIGNING_KEY: ${{ secrets.BACKEND_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          : "${BACKEND_RELEASE_SIGNING_KEY:?서명 키가 필요합니다.}"
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo 'main 브랜치에 더 최근 커밋이 있습니다.'
            exit 0
          fi

          tag="deploy-$GITHUB_SHA"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            exit 0
          fi

          umask 077
          key=$(mktemp)
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$BACKEND_RELEASE_SIGNING_KEY" > "$key"
          {
            printf '%s %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            sha256sum backend-image.tar.gz deploy.tar.gz
          } > manifest
          openssl pkeyutl -sign -rawin -inkey "$key" -in manifest -out manifest.sig

          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --prerelease --title "Backend ${GITHUB_SHA:0:12}" --notes "Verified production build."
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber \
            backend-image.tar.gz deploy.tar.gz manifest manifest.sig
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false
      - name: Verify NCP deployment
        if: vars.NCP_BACKEND_ORIGIN != ''
        env:
          NCP_BACKEND_ORIGIN: ${{ vars.NCP_BACKEND_ORIGIN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 서버는 약 2분마다 릴리스를 확인하고, 이미지 다운로드·마이그레이션까지 몇 분 걸린다.
          for attempt in {1..72}; do
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$head" != "$GITHUB_SHA" ]]; then
              exit 0
            fi
            if curl --proto '=https' -fsS --max-time 5 "$NCP_BACKEND_ORIGIN/healthz" 2>/dev/null \
              | jq -e --arg revision "$GITHUB_SHA" '.status == "ok" and .revision == $revision' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo '운영 서버에서 이 릴리스를 확인하지 못했습니다.'
          exit 1
      - name: Apply runtime secrets
        env:
          BACKEND_CONFIG_SSH_KEY: ${{ secrets.BACKEND_CONFIG_SSH_KEY }}
          AUTHOR_INVITE_CODES: ${{ secrets.AUTHOR_INVITE_CODES }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          CLOVA_OCR_INVOKE_URL: ${{ secrets.CLOVA_OCR_INVOKE_URL }}
          CLOVA_OCR_SECRET: ${{ secrets.CLOVA_OCR_SECRET }}
          CLOVA_STUDIO_API_KEY: ${{ secrets.CLOVA_STUDIO_API_KEY }}
          CLOVA_VOICE_CLIENT_ID: ${{ secrets.CLOVA_VOICE_CLIENT_ID }}
          CLOVA_VOICE_CLIENT_SECRET: ${{ secrets.CLOVA_VOICE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$BACKEND_CONFIG_SSH_KEY" > "$HOME/.ssh/backend-config"
          printf '%s\n' '211.233.198.172 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGbNonSILyIqnWG2+cTmYQtYvRgGGiVHvHfCt+c4FdXt' > "$HOME/.ssh/known_hosts"
          python3 - <<'PY' | ssh -T -i "$HOME/.ssh/backend-config" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@211.233.198.172
          import json, os
          names = ('AUTHOR_INVITE_CODES', 'STORAGE_BUCKET', 'STORAGE_ACCESS_KEY', 'STORAGE_SECRET_KEY', 'CLOVA_OCR_INVOKE_URL', 'CLOVA_OCR_SECRET', 'CLOVA_STUDIO_API_KEY', 'CLOVA_VOICE_CLIENT_ID', 'CLOVA_VOICE_CLIENT_SECRET')
          values = {name: os.environ[name] for name in names}
          if not all(values.values()):
              raise SystemExit('운영 연동 Secrets가 비어 있습니다.')
          print(json.dumps(values))
          PY
