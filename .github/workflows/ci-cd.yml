name: Backend CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test and build
        env:
          GOTOOLCHAIN: local
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          mkdir dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-X main.revision=$GITHUB_SHA" -o dist/backend-linux-amd64 .
          for script in ops/*.sh; do bash -n "$script"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: backend-linux-amd64
          path: dist/backend-linux-amd64
          if-no-files-found: error
          retention-days: 3

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    concurrency:
      group: backend-production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-linux-amd64
          path: dist
      - name: Sign and publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_RELEASE_SIGNING_KEY: ${{ secrets.BACKEND_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          : "${BACKEND_RELEASE_SIGNING_KEY:?서명 키가 필요합니다.}"
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo 'main 브랜치에 더 최근 커밋이 있습니다.'
            exit 0
          fi

          tag="deploy-$GITHUB_SHA"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            exit 0
          fi

          umask 077
          key=$(mktemp)
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$BACKEND_RELEASE_SIGNING_KEY" > "$key"
          {
            printf '%s %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            sha256sum backend-linux-amd64
          } > manifest
          openssl pkeyutl -sign -rawin -inkey "$key" -in manifest -out manifest.sig

          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --prerelease --title "Backend ${GITHUB_SHA:0:12}" --notes "Verified production build."
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber backend-linux-amd64 manifest manifest.sig
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false
      - name: Verify NCP deployment
        if: vars.NCP_BACKEND_ORIGIN != ''
        env:
          NCP_BACKEND_ORIGIN: ${{ vars.NCP_BACKEND_ORIGIN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..48}; do
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$head" != "$GITHUB_SHA" ]]; then
              exit 0
            fi
            if curl --proto '=https' -fsS --max-time 5 "$NCP_BACKEND_ORIGIN/healthz" 2>/dev/null \
              | jq -e --arg revision "$GITHUB_SHA" '.status == "ok" and .revision == $revision' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo '운영 서버에서 이 릴리스를 확인하지 못했습니다.'
          exit 1
